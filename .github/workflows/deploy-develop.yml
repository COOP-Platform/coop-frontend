name: Deploy develop to Vercel (Preview)

# Fires only when code actually lands on develop (direct push or PR merge).
# Never runs on pull_request, so forks/PRs can never reach the Vercel token.
on:
  push:
    branches: [develop]

# Never cancel a deploy that is already in flight — queue instead, so develop
# always converges on the newest commit.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Marks the deployment in the GitHub UI and surfaces the resulting URL.
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}

    # The Vercel CLI reads VERCEL_ORG_ID + VERCEL_PROJECT_ID directly from the
    # environment. Verified against the v59.4.0 source: when BOTH are set the
    # CLI uses them as the project link and never reads .vercel/project.json,
    # so no linking step is needed or useful here.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Pinned rather than @latest: a CLI major bump should be a deliberate,
      # reviewable change, not something that breaks deploys unannounced.
      - name: Install Vercel CLI
        run: npm install --global vercel@59.4.0

      # Fail fast with an actionable message instead of the CLI's generic
      # "Could not retrieve Project Settings". Values are never echoed — the
      # tests below only ever yield a true/false, never the value itself.
      - name: Validate Vercel credentials
        # Explicit: this step uses bash-only [[ =~ ]] string matching.
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "${VERCEL_TOKEN:-}" ]      || fail "VERCEL_TOKEN secret is empty or unset."
          [ -n "${VERCEL_ORG_ID:-}" ]     || fail "VERCEL_ORG_ID secret is empty or unset."
          [ -n "${VERCEL_PROJECT_ID:-}" ] || fail "VERCEL_PROJECT_ID secret is empty or unset."

          # A trailing newline or stray space pasted into a GitHub secret makes
          # the ID invalid, and the CLI reports it as a missing project.
          #
          # Uses bash [[ =~ ]] rather than grep on purpose: grep matches line by
          # line, so "prj_XXXX\n" looks like one perfectly valid line and the
          # trailing newline — the most common paste error — slips through.
          # [[ =~ ]] matches against the whole string, so it catches it.
          [[ "$VERCEL_PROJECT_ID" =~ ^prj_[A-Za-z0-9]+$ ]] \
            || fail "VERCEL_PROJECT_ID is malformed. Expected prj_XXXX with no surrounding whitespace — re-paste the secret."
          [[ "$VERCEL_ORG_ID" =~ ^(team_)?[A-Za-z0-9]+$ ]] \
            || fail "VERCEL_ORG_ID is malformed. Expected team_XXXX (or a user id) with no surrounding whitespace — re-paste the secret."

          echo "Credential shape OK."

      # Authentication preflight.
      #
      # `vercel whoami` was here and has been removed: it is the WRONG test for
      # a team-scoped token. Verified in the vercel@59.4.0 source, whoami ->
      # fetchUser() -> client.fetch("/v2/user", { useCurrentTeam: false }).
      # That is the PERSONAL-ACCOUNT endpoint and it explicitly suppresses team
      # context, so it never sends teamId. A token scoped only to a Team gets
      # no user record back and the CLI reports "User not found." even though
      # the token is perfectly able to reach the team's projects. It was a
      # false-negative gate that blocked the deploy before the real check ran.
      #
      # The deploy path does not call /v2/user at all. getOrgById() branches on
      # orgId.startsWith("team_") -> getTeamById() -> /teams/<id>, and
      # getProjectByNameOrId() calls /v9/projects/<id> with { accountId }, which
      # _fetch turns into ?teamId=<accountId>. So the two calls below are the
      # actual authentication path the CLI is about to take.
      #
      # Only HTTP status codes are printed. The token travels in an
      # Authorization header and response bodies are discarded to /dev/null,
      # so nothing sensitive can reach the log.
      - name: Preflight Vercel API authentication
        shell: bash
        run: |
          set -euo pipefail

          # Prints only the HTTP status. The body goes to /dev/null so no
          # response content can ever reach the log.
          probe() {
            curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Accept: application/json' "$1"
          }

          explain() {
            # $1 = status, $2 = what was being accessed
            case "$1" in
              200) echo "  200 OK - token is authorised for $2." ;;
              401) echo "::error::401 Unauthorized accessing $2. VERCEL_TOKEN is invalid, expired or revoked."; return 1 ;;
              403) echo "::error::403 Forbidden accessing $2. The token authenticates but is not authorised for this team. Check the token's team scope in Vercel > Account Settings > Tokens."; return 1 ;;
              404) echo "::error::404 Not Found for $2. The id does not exist under this scope - re-check VERCEL_ORG_ID / VERCEL_PROJECT_ID against Vercel > Project > Settings."; return 1 ;;
              *)   echo "::error::Unexpected HTTP $1 accessing $2."; return 1 ;;
            esac
          }

          # 1. Team reachability. Mirrors getTeamById() -> /teams/<id>.
          #    Skipped when VERCEL_ORG_ID is a personal account id, because the
          #    CLI only takes the team branch for ids beginning "team_".
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            echo "Checking team access..."
            explain "$(probe "https://api.vercel.com/v2/teams/${VERCEL_ORG_ID}")" "the team in VERCEL_ORG_ID"
          else
            echo "VERCEL_ORG_ID is not a team id - skipping the team check."
          fi

          # 2. Project reachability, scoped by teamId exactly as the CLI does.
          echo "Checking project access..."
          explain "$(probe "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")" "the project in VERCEL_PROJECT_ID"

          echo "Preflight passed - the token can reach this team and project."

      # Pulls the PREVIEW environment settings + env vars into .vercel/.
      # The CLI identifies the project from VERCEL_ORG_ID + VERCEL_PROJECT_ID
      # (see note in the env block). --environment=preview keeps this off the
      # production target.
      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # Builds locally against the pulled preview env. Any VITE_* variable set
      # in Vercel for the Preview environment is inlined into the bundle here.
      # No --prod flag, so this produces a preview build.
      - name: Build project artifacts
        run: vercel build --token="$VERCEL_TOKEN"

      # --prebuilt uploads .vercel/output instead of rebuilding on Vercel.
      # No --prod flag => Preview deployment. This cannot become the production
      # deployment or touch any production alias.
      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '\r')"
          case "$url" in
            https://*) ;;
            *) echo "::error::Deploy did not return a URL. Got: $url"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Summarise deployment
        run: |
          {
            echo "### Develop preview deployed :rocket:"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | Preview (non-production) |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

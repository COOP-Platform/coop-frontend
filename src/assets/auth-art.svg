<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Auth screens' picture panel: soft brand greens, a winding path and a
       resting sphere. Drawn for COOP; no third-party imagery. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f1"/>
      <stop offset="1" stop-color="#cfe9d9"/>
    </linearGradient>
    <linearGradient id="wallTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbf8"/>
      <stop offset="1" stop-color="#dcefe3"/>
    </linearGradient>
    <linearGradient id="wallSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9dcc6"/>
      <stop offset="1" stop-color="#9fcdb1"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e7f4ec"/>
      <stop offset="1" stop-color="#a9d3ba"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- shadow under the track -->
  <path d="M-60 900 C 120 760, 260 800, 360 690 S 520 420, 680 420 S 900 300, 900 220"
        fill="none" stroke="#0f4d2c" stroke-opacity="0.10" stroke-width="150"
        stroke-linecap="round" filter="url(#soft)" transform="translate(18 34)"/>

  <!-- track: side wall, then the lighter top, then the groove -->
  <path d="M-60 900 C 120 760, 260 800, 360 690 S 520 420, 680 420 S 900 300, 900 220"
        fill="none" stroke="url(#wallSide)" stroke-width="150" stroke-linecap="round"
        transform="translate(0 16)"/>
  <path d="M-60 900 C 120 760, 260 800, 360 690 S 520 420, 680 420 S 900 300, 900 220"
        fill="none" stroke="url(#wallTop)" stroke-width="150" stroke-linecap="round"/>
  <path d="M-60 900 C 120 760, 260 800, 360 690 S 520 420, 680 420 S 900 300, 900 220"
        fill="none" stroke="#c6e4d1" stroke-width="86" stroke-linecap="round"/>
  <path d="M-60 900 C 120 760, 260 800, 360 690 S 520 420, 680 420 S 900 300, 900 220"
        fill="none" stroke="#e3f2e8" stroke-width="70" stroke-linecap="round"/>

  <!-- segment joints -->
  <g stroke="#9fcdb1" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="150" y1="742" x2="196" y2="872"/>
    <line x1="318" y1="650" x2="408" y2="742"/>
    <line x1="440" y1="508" x2="560" y2="560"/>
    <line x1="620" y1="352" x2="650" y2="490"/>
    <line x1="790" y1="300" x2="842" y2="420"/>
  </g>

  <!-- the sphere, resting in the groove -->
  <ellipse cx="575" cy="478" rx="44" ry="12" fill="#0f4d2c" opacity="0.14" filter="url(#soft)"/>
  <circle cx="568" cy="446" r="38" fill="url(#sphere)"/>
</svg>
